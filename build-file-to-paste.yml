name: Build Real Pathfinder

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # PlayerFix.hpp was generated from this exact bindings commit.
          bindings-ref: d641858f3e1cd2c6d86013c799f224ebdb8ec1cd
          combine: true
          target: Win64

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Real Pathfinder
          path: ${{ steps.build.outputs.build-output }}
